<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | 0D Technologies</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://0dtechnologies.com/404.html">
    <meta property="og:image" content="https://0dtechnologies.com/og-image.svg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Inter',sans-serif;
            background:#060912;
            color:#e0e0e0;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:40px 20px;
        }
        .code{font-size:8rem;font-weight:800;background:linear-gradient(135deg,#38bdf8,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:10px}
        h1{font-size:1.5rem;color:#ffffff;margin-bottom:8px}
        p{color:#64748b;margin-bottom:30px;max-width:400px}
        a{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:linear-gradient(135deg,#38bdf8,#a78bfa);color:#fff;text-decoration:none;border-radius:10px;font-weight:600;transition:transform 0.3s,box-shadow 0.3s}
        a:hover{transform:scale(1.03);box-shadow:0 8px 30px rgba(56,189,248,0.2)}
            /* â”€â”€ MOBILE NAV FIX â”€â”€ */
        @media(max-width:900px){
            .mobile-toggle{display:block!important}
            .nav-links{display:none!important;position:fixed;top:72px;left:0;right:0;bottom:0;background:rgba(10,14,26,0.98);backdrop-filter:blur(20px);flex-direction:column;align-items:flex-start!important;padding:24px;gap:4px!important;overflow-y:auto;z-index:99}
            .nav-links.show{display:flex!important}
            .nav-links a{width:100%;padding:14px 16px!important;font-size:.95rem!important}
            .nav-links .nav-btn{width:100%;text-align:center;justify-content:center;margin-top:12px}
            .dropdown .dd-menu,.nav-dropdown .drop-menu{position:static!important;transform:none!important;opacity:1!important;visibility:visible!important;display:none;box-shadow:none!important;border:none!important;background:rgba(255,255,255,.04)!important;margin:4px 0 8px 12px;width:calc(100% - 12px)}
            .dropdown.open .dd-menu,.nav-dropdown.open .drop-menu{display:block!important}
        }
        </style>
    <link rel="stylesheet" href="ui.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <noscript><style>.r{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="index.html">&larr; Back to Home</a>
<script>
// Mobile nav: close on link click, handle dropdowns
document.querySelectorAll('.nav-links a').forEach(a=>a.addEventListener('click',()=>{if(window.innerWidth<=900)document.querySelector('.nav-links')?.classList.remove('show')}));
document.querySelectorAll('.nav-dropdown .drop-btn, .dropdown > a').forEach(btn=>{
  btn.addEventListener('click',e=>{
    if(window.innerWidth<=900){
      e.preventDefault();
      const dd = btn.closest('.nav-dropdown, .dropdown');
      dd.classList.toggle('open');
    }
  });
});
document.addEventListener('click',e=>{
  if(!e.target.closest('nav')) document.querySelector('.nav-links')?.classList.remove('show');
});
</script>
<script src="parth.js?v=9"></script>
    <script src="ui.js" defer></script>
</body>
</html>
