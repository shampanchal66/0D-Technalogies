<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | ZDT</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://zdt.com/404.html">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Inter',sans-serif;
            background:#070a14;
            color:#e0e0e0;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:40px 20px;
        }
        .code{font-size:8rem;font-weight:800;background:linear-gradient(135deg,#00d4ff,#7b2ff7,#ff2d95);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:10px}

        p{color:#7a8baa;margin-bottom:30px;max-width:400px}
        a{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:linear-gradient(135deg,#00d4ff,#7b2ff7);color:#fff;text-decoration:none;border-radius:10px;font-weight:600;transition:transform 0.3s,box-shadow 0.3s}
        a:hover{transform:scale(1.03);box-shadow:0 8px 30px rgba(0,212,255,0.2)}
    </style>
</head>
<body>
    <div class="code">404</div>
